{% extends "account/base.html" %}
{% block title %}Request Sourcing — Duoshao Trading{% endblock %}
{% block content %}
<div class="section-title"><span>Request a Product</span></div>

<form class="form-card" method="POST">
  <div class="form-group">
    <label>Contact Number (if different from profile)</label>
    <input type="text" name="contact" placeholder="{{ customer.phone if customer else '' }}">
  </div>
  <div class="form-group">
    <label>Product You Need *</label>
    <input type="text" name="product_name" required>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Category</label><input type="text" name="category"></div>
    <div class="form-group"><label>Quantity</label><input type="text" name="quantity"></div>
  </div>
  <div class="form-group">
    <label>Additional Notes</label>
    <textarea name="notes"></textarea>
  </div>
  <button type="submit" class="btn btn-gold" style="width:100%;">Submit Request</button>
</form>
{% endblock %}

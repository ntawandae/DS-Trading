<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}My Account — Duoshao Trading{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version('css/style.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon-navy.png') }}">
</head>
<body>

{% include "_nav.html" %}

<main>
  <div class="container" style="padding-top:30px; padding-bottom:60px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</main>

{% include "public/_footer.html" %}

</body>
</html>

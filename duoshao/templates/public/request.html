{% extends "public/base.html" %}
{% block title %}Request Sourcing — Duoshao Trading Co., Ltd.{% endblock %}
{% block content %}
<div class="container" style="padding-top:40px;">
  <div class="section-title"><span>Request a Product</span></div>
  <p class="muted" style="max-width:560px; margin-bottom:26px;">Tell us what you're looking for and we'll get back to you with pricing, minimum order quantity, and lead time.</p>

  <form class="form-card" method="POST">
    <div class="form-group">
      <label>Your Name *</label>
      <input type="text" name="customer_name" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone / WhatsApp / Email *</label>
        <input type="text" name="contact" required>
      </div>
      <div class="form-group">
        <label>Country</label>
        <input type="text" name="country" placeholder="e.g. Zimbabwe">
      </div>
    </div>
    <div class="form-group">
      <label>Product You Need *</label>
      <input type="text" name="product_name" required value="{{ prefill_product or '' }}" placeholder="e.g. Smart toilet, PA speaker set, laptops...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" placeholder="e.g. Smart Home, Events, Tech">
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="text" name="quantity" placeholder="e.g. 50 units, 1 container">
      </div>
    </div>
    <div class="form-group">
      <label>Additional Notes</label>
      <textarea name="notes" placeholder="Specifications, budget range, timeline..."></textarea>
    </div>
    <button type="submit" class="btn btn-gold" style="width:100%;">Submit Request</button>
  </form>
</div>
{% endblock %}

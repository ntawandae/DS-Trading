{% extends "public/base.html" %}
{% block title %}Pay with PayPal — Duoshao Trading Co., Ltd.{% endblock %}
{% block content %}
<div class="container" style="padding-top:50px; padding-bottom:70px; text-align:center;">
  <h1>Complete Payment — Order #{{ sale.id }}</h1>
  <p class="muted" style="margin:14px auto 30px;">Amount due: <strong>${{ "%.2f"|format(sale.balance_due) }}</strong></p>

  <div id="paypal-button-container" style="max-width:360px; margin:0 auto;"></div>
  <p id="paypal-status" class="muted" style="margin-top:16px;"></p>
</div>

<script src="https://www.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=USD"></script>
<script>
paypal.Buttons({
  createOrder: function() {
    return fetch("{{ url_for('cart.paypal_create', sale_id=sale.id) }}", { method: "POST" })
      .then(res => res.json())
      .then(data => data.id);
  },
  onApprove: function(data) {
    document.getElementById('paypal-status').innerText = "Processing payment...";
    return fetch("{{ url_for('cart.paypal_capture', sale_id=sale.id) }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderID: data.orderID })
    })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
          window.location.href = result.redirect;
        } else {
          document.getElementById('paypal-status').innerText = "Payment could not be completed. Please try again.";
        }
      });
  }
}).render('#paypal-button-container');
</script>
{% endblock %}

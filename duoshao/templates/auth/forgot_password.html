<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password — Duoshao Trading</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version('css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <a href="{{ url_for('public.home') }}" class="muted" style="display:inline-block; margin-bottom:14px; font-size:13px;">&larr; Back to Home</a>
    <img src="{{ url_for('static', filename='img/icon-navy.png') }}" alt="Duoshao">
    <h2 style="margin-bottom:6px;">Forgot Password</h2>
    <p class="muted" style="margin-bottom:22px;">Enter your username or email and we'll send you a reset link.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" style="text-align:left;">
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" name="username" required autofocus>
      </div>
      <button type="submit" class="btn btn-navy" style="width:100%;">Send Reset Link</button>
    </form>
    <p class="muted" style="text-align:center; margin-top:16px;">
      <a href="{{ url_for('auth.login') }}">Back to login</a>
    </p>
  </div>
</div>
</body>
</html>

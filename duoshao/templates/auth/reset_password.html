<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Duoshao Trading</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <img src="{{ url_for('static', filename='img/icon-navy.png') }}" alt="Duoshao">
    <h2 style="margin-bottom:6px;">Reset Password</h2>
    <p class="muted" style="margin-bottom:22px;">Choose a new password below.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" style="text-align:left;">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="password" required minlength="6" autofocus>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-navy" style="width:100%;">Set New Password</button>
    </form>
  </div>
</div>
</body>
</html>

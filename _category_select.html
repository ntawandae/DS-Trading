{% macro category_select(categories, selected='', id_prefix='cat') %}
{% set is_new = selected and selected not in categories %}
<select name="category" id="{{ id_prefix }}-category-select"
        onchange="document.getElementById('{{ id_prefix }}-new-category-wrap').style.display = (this.value === '__new__') ? 'block' : 'none';">
  <option value="">— Select —</option>
  {% for c in categories %}
  <option value="{{ c }}" {{ 'selected' if c == selected }}>{{ c }}</option>
  {% endfor %}
  <option value="__new__" {{ 'selected' if is_new }}>+ Add New Category</option>
</select>
<div id="{{ id_prefix }}-new-category-wrap" style="display:{{ 'block' if is_new else 'none' }}; margin-top:8px;">
  <input type="text" name="new_category" placeholder="New category name" value="{{ selected if is_new else '' }}">
</div>
{% endmacro %}
